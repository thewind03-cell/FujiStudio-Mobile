name: FujiStudioBindings
description: Auto-generated Dart FFI bindings for native/include/fujistudio_c_api.h. Do not edit by hand.
output: 'lib/core/ffi/bindings.g.dart'
headers:
  entry-points:
    - 'native/include/fujistudio_c_api.h'
  include-directives:
    - 'native/include/fujistudio_c_api.h'
compiler-opts:
  - '-DFUJISTUDIO_CORE_STATIC'
functions:
  include:
    - 'fs_.*'
structs:
  include:
    - 'FsRafMetadata'
    - 'FsDnaRescueParams'
    - 'FsDnaRescueSuggestion'
enums:
  include:
    - 'FsStatusCode'
    - 'FsExifOrientation'
    - 'FsDnaRescueMode'
macros:
  include:
    - 'FS_MAX_IMAGE_DIMENSION'
    - 'FS_RAF_.*'
comments:
  style: any
  length: full
preamble: |
  // GENERATED CODE - DO NOT MODIFY BY HAND.
  // Regenerate with: dart run ffigen --config ffigen.yaml
  // ignore_for_file: always_specify_types, camel_case_types, non_constant_identifier_names, unused_element, unused_field
